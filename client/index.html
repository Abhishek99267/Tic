<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tic Tac Arena</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >
</head>

<body>

    <main class="home">

        <section class="hero">

            <div class="logo">
                TIC TAC
                <span>ARENA</span>
            </div>

            <p class="tagline">
                Classic Tic-Tac-Toe.
                Multiplayer Battle.
            </p>

            <div class="home-card">

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your name"
                    maxlength="20"
                >

                <button
                    id="createRoomBtn"
                    class="primary-btn"
                >
                    CREATE GAME
                </button>

                <button
                    id="joinRoomBtn"
                    class="secondary-btn"
                >
                    JOIN GAME
                </button>

            </div>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
