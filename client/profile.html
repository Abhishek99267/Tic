<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tic Tac Arena - Profile</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <style>

        .match-score {
    font-size: 15px;
    letter-spacing: 1px;
}

.history-info p + p {
    margin-top: 3px;
}

        .profile-page {
            min-height: 100vh;
            padding: 30px;
            max-width: 1100px;
            margin: auto;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .profile-header h1 {
            margin: 5px 0;
            font-size: 32px;
        }

        .profile-header p {
            margin: 0;
            color: #8d95a7;
        }

        .back-button {
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
        }

        .back-button:hover {
            background: rgba(255,255,255,0.1);
        }

        /* PROFILE CARD */

        .profile-card {
            display: flex;
            align-items: center;
            gap: 22px;

            padding: 25px;

            border-radius: 20px;

            background: rgba(255,255,255,0.04);

            border: 1px solid
                rgba(255,255,255,0.08);

            margin-bottom: 25px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: rgba(255,255,255,0.08);

            font-size: 40px;
        }

        .profile-info h2 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .profile-info p {
            margin: 0;
            color: #8d95a7;
        }

        /* BALANCE */

        .balance-card {
            padding: 25px;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            border: 1px solid
                rgba(255,255,255,0.08);

            margin-bottom: 25px;
        }

        .balance-label {
            color: #8d95a7;
            font-size: 14px;
        }

        .balance-value {
            margin-top: 8px;
            font-size: 38px;
            font-weight: 800;
        }

        .coin-icon {
            font-size: 30px;
        }

        /* STATS */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(5, 1fr);

            gap: 15px;

            margin-bottom: 35px;
        }

        .stat-card {
            padding: 20px;

            border-radius: 16px;

            background:
                rgba(255,255,255,0.04);

            border: 1px solid
                rgba(255,255,255,0.07);
        }

        .stat-card span {
            display: block;

            color: #8d95a7;

            font-size: 13px;

            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 25px;
        }

        /* SECTION */

        .profile-section {
            margin-top: 30px;
        }

        .section-label {
            font-size: 11px;

            letter-spacing: 2px;

            color: #8d95a7;

            font-weight: 700;
        }

        .section-heading h2 {
            margin: 6px 0 18px;

            font-size: 24px;
        }

        /* HISTORY */

        .match-history {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .match-history-card {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 18px 20px;

            border: 1px solid
                rgba(255,255,255,0.08);

            border-radius: 16px;

            background:
                rgba(255,255,255,0.03);

            transition: 0.2s;
        }

        .match-history-card:hover {
            transform: translateY(-2px);

            border-color:
                rgba(255,255,255,0.18);
        }

        .history-main {
            display: flex;

            align-items: center;

            gap: 14px;
        }

        .history-game-icon {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.06);

            font-size: 22px;
        }

        .history-info h3 {
            margin: 0 0 5px;

            font-size: 16px;
        }

        .history-info p {
            margin: 0;

            color: #8d95a7;

            font-size: 13px;
        }

        .history-result {
            display: flex;

            align-items: flex-end;

            flex-direction: column;

            gap: 7px;
        }

        .result-badge {
            padding: 6px 12px;

            border-radius: 999px;

            font-size: 12px;

            font-weight: 700;
        }

        .result-badge.win {
            color: #70f0a5;

            background:
                rgba(40,200,100,0.12);
        }

        .result-badge.loss {
            color: #ff8585;

            background:
                rgba(255,70,70,0.12);
        }

        .result-badge.abandoned {
            color: #ffc86b;

            background:
                rgba(255,180,50,0.12);
        }

        .round-count {
            color: #8d95a7;

            font-size: 12px;
        }

        .empty-history {
            text-align: center;

            padding: 45px 20px;

            border: 1px dashed
                rgba(255,255,255,0.12);

            border-radius: 16px;
        }

        .empty-icon {
            font-size: 35px;

            margin-bottom: 10px;
        }

        .empty-history h3 {
            margin: 0 0 6px;
        }

        .empty-history p {
            margin: 0;

            color: #8d95a7;
        }

        .history-loading,
        .history-error {
            padding: 25px;

            text-align: center;

            color: #8d95a7;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .stats-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .profile-page {
                padding: 18px;
            }

            .profile-header {
                align-items: flex-start;
                gap: 15px;
            }

            .profile-card {
                padding: 18px;
            }

            .profile-avatar {
                width: 60px;
                height: 60px;
                font-size: 30px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .match-history-card {
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

<main class="profile-page">

    <!-- HEADER -->

    <header class="profile-header">

        <div>

            <span class="brand">
                Tic Tac Arena
            </span>

            <h1>My Profile</h1>

            <p>
                Your player profile and match history
            </p>

        </div>


        <button
            id="backBtn"
            class="back-button"
            type="button"
        >
            ← Back
        </button>

    </header>


    <!-- PROFILE -->

    <section class="profile-card">

        <div
            id="profileAvatar"
            class="profile-avatar"
        >
            🧑
        </div>


        <div class="profile-info">

            <h2 id="profileUsername">
                Player
            </h2>

            <p>
                Player ID:
                <span id="profilePlayerId">
                    Loading...
                </span>
            </p>

        </div>

    </section>


    <!-- BALANCE -->

    <section class="balance-card">

        <div class="balance-label">
            Available Points
        </div>


        <div class="balance-value">

            <span class="coin-icon">
                🪙
            </span>

            <span id="profileBalance">
                0
            </span>

        </div>

    </section>


    <!-- STATS -->

    <section class="stats-grid">

        <div class="stat-card">

            <span>
                Match Wins
            </span>

            <strong id="profileWins">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Match Losses
            </span>

            <strong id="profileLosses">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Matches Played
            </span>

            <strong id="profileMatches">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Rounds Won
            </span>

            <strong id="profileRoundsWon">
                0
            </strong>

        </div>


        <div class="stat-card">

            <span>
                Rounds Lost
            </span>

            <strong id="profileRoundsLost">
                0
            </strong>

        </div>

    </section>


    <!-- MATCH HISTORY -->

    <section class="profile-section">

        <div class="section-heading">

            <span class="section-label">
                HISTORY
            </span>

            <h2>
                Recent Matches
            </h2>

        </div>


        <div
            id="matchHistory"
            class="match-history"
        >

            <div class="history-loading">
                Loading matches...
            </div>

        </div>

    </section>

</main>


<script src="js/profile.js"></script>


<script>

    const backBtn =
        document.getElementById("backBtn");


    if (backBtn) {

        backBtn.addEventListener(
            "click",
            () => {

                window.location.href =
                    "index.html";

            }
        );

    }

</script>
<script src="js/config.js"></script>

<script src="js/profile.js"></script>

</body>

</html>
